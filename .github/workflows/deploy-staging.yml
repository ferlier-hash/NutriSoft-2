name: NutriSoft · Deploy staging

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribí DEPLOY-STAGING para confirmar la migración remota'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'DEPLOY-STAGING'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify release before remote mutation
        run: npm run verify:frontend
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Validate staging invitation return URL
        env:
          STAGING_AUTH_REDIRECT_URL: ${{ vars.STAGING_AUTH_REDIRECT_URL }}
        run: |
          if [ -z "$STAGING_AUTH_REDIRECT_URL" ]; then
            echo 'Definí STAGING_AUTH_REDIRECT_URL en el environment staging antes de desplegar invitaciones.' >&2
            exit 1
          fi
          node -e 'const u = new URL(process.env.STAGING_AUTH_REDIRECT_URL); const local = ["localhost", "127.0.0.1"].includes(u.hostname); if (!(u.protocol === "https:" || (u.protocol === "http:" && local)) || u.pathname !== "/" || u.searchParams.get("auth") !== "invite") { console.error("STAGING_AUTH_REDIRECT_URL debe usar HTTPS o un origen localhost con la ruta /?auth=invite."); process.exit(1); }'
      - name: Link staging project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ "$SUPABASE_PROJECT_REF" != "krnkdwjunqnfynsdmgxk" ]; then
            echo 'El proyecto configurado no coincide con staging; se detiene antes de migrar.' >&2
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Staging has three unapplied historical migrations (57-59) before its
        # current latest version. Include only local migrations absent remotely.
        run: supabase db push --include-all
      - name: Deploy professional invitations function to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          STAGING_AUTH_REDIRECT_URL: ${{ vars.STAGING_AUTH_REDIRECT_URL }}
        run: |
          supabase secrets set "APP_AUTH_REDIRECT_URL=$STAGING_AUTH_REDIRECT_URL" --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy professional-invitations --project-ref "$SUPABASE_PROJECT_REF"
      - name: Record deployed revision
        run: echo "staging deployed $GITHUB_SHA via $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
