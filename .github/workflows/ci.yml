name: NutriSoft CI Pipeline

on:
  push:
    branches: [ 'main', 'phase-*' ]
  pull_request:
    branches: [ 'main', 'phase-*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Frontend & Database Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Frontend Linting
        run: npm run lint

      - name: Frontend Typecheck
        run: npm run typecheck

      - name: Frontend Vitest Suite
        run: npm run test

      - name: Frontend Production Build
        run: npm run build

      - name: Start Local Supabase
        run: npx supabase start

      - name: Database Reset & Seed
        run: npm run db:reset

      - name: Database pgTAP Test Suite
        run: npm run db:test

      - name: Database Linting
        run: npm run db:lint

      - name: Database TypeScript Verification
        run: npm run db:verify-types

      - name: Generate Workflow Metadata
        if: always()
        run: |
          mkdir -p review/reports/phase-2.1.1
          cat << 'EOF' > review/reports/phase-2.1.1/00-ci-workflow-metadata.json
          {
            "GITHUB_SHA": "${{ github.sha }}",
            "GITHUB_REF": "${{ github.ref }}",
            "GITHUB_RUN_ID": "${{ github.run_id }}",
            "GITHUB_RUN_ATTEMPT": "${{ github.run_attempt }}",
            "GITHUB_WORKFLOW": "${{ github.workflow }}",
            "GITHUB_EVENT_NAME": "${{ github.event_name }}",
            "WORKFLOW_URL": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "TIMESTAMP_UTC": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Upload Verification Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2.1.1-verification-reports
          path: review/reports/phase-2.1.1/

      - name: Stop Local Supabase
        if: always()
        run: npx supabase stop
