name: NutriSoft CI Pipeline

on:
  push:
    branches: [ main, phase-2-backend-foundation, phase-1.1-stabilization ]
  pull_request:
    branches: [ main, phase-2-backend-foundation ]

jobs:
  verify:
    name: Frontend & Database Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Frontend Linting
        run: npm run lint

      - name: Frontend Typecheck
        run: npm run typecheck

      - name: Frontend Vitest Suite
        run: npm run test

      - name: Frontend Production Build
        run: npm run build

      - name: Start Local Supabase
        run: npx supabase start

      - name: Database Reset & Seed
        run: npm run db:reset

      - name: Database pgTAP Test Suite
        run: npm run db:test

      - name: Database Linting
        run: npm run db:lint

      - name: Database TypeScript Verification
        run: npm run db:verify-types

      - name: Stop Local Supabase
        if: always()
        run: npx supabase stop
