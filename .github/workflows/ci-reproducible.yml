name: NutriSoft · CI reproducible

on:
  pull_request:
    branches: [main, 'codex/staging-admin-backend-*']
  push:
    branches: [main, 'codex/staging-admin-backend-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frontend, database and security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify frontend
        run: npm run verify:frontend
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Start isolated Supabase services
        run: supabase start
      - name: Verify database and RLS
        env:
          SUPABASE_TELEMETRY_DISABLED: '1'
        run: SUPABASE_CLI_BINARY_OVERRIDE="$(command -v supabase)" npm run verify:database
      - name: Verify tracked files contain no known secrets
        run: |
          if git grep -IlE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sb_secret_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk_live_[A-Za-z0-9]{20,}|APP_USR-[A-Za-z0-9]{20,}' -- ':!review/reports/**'; then
            echo 'Potential secret found in tracked files.'
            exit 1
          fi
