name: NutriSoft · CI reproducible

on:
  pull_request:
    branches: [phase-1.1-stabilization]
  push:
    branches: [phase-1.1-stabilization]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify frontend and security
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify tracked files contain no known secrets
        run: |
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sb_secret_|ghp_[A-Za-z0-9]{20,}|github_pat_|sk_live_|APP_USR-' -- ':!review/reports/**' ':!.github/workflows/ci-reproducible.yml'; then
            echo 'Potential secret found in tracked files.'
            exit 1
          fi
